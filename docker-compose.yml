services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: finmang
      POSTGRES_USER: finmang
      POSTGRES_PASSWORD: finmang
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finmang -d finmang"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://finmang:finmang@db:5432/finmang
      APP_NAME: FinMang OS
      APP_VERSION: 1.0.0
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
